name: Manual Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  daml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install DPM SDK 3.5.12
        run: |
          curl -sSL https://get.digitalasset.com/install/install.sh | DPM_EDITION=open-source bash -s 3.5.12
          echo "$HOME/.dpm/bin" >> "$GITHUB_PATH"
      - name: Build Daml
        working-directory: daml
        run: DPM_SDK_VERSION=3.5.12 dpm build --all
      - name: Test Daml
        working-directory: daml
        run: DPM_SDK_VERSION=3.5.12 dpm test

  repository-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required competition files exist
        run: |
          test -f LOCKED_DECISIONS.md
          test -f docs/COMPETITION_COMPLIANCE.md
          test -f docs/WINNING_STANDARD.md
          test -f docs/RULES_SNAPSHOT.md
          test -f daml/daml/CommitLedger.daml
          test -f daml/daml/Test.daml
          test -f src/github-verifier.mjs
          test -f src/canton-json-api.mjs
          test -f web/index.html
      - name: No forbidden runtime dependencies
        run: |
          ! grep -RniE 'vercel|supabase' package.json src web scripts daml || {
            echo "Forbidden runtime dependency reference detected"
            exit 1
          }
