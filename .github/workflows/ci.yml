name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  node-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  repository-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required competition files exist
        run: |
          test -f LOCKED_DECISIONS.md
          test -f docs/COMPETITION_COMPLIANCE.md
          test -f docs/WINNING_STANDARD.md
          test -f daml/daml/CommitLedger.daml
          test -f daml/daml/Test.daml
          test -f src/github-verifier.mjs
          test -f src/canton-json-api.mjs
          test -f web/index.html
      - name: No forbidden runtime dependencies
        run: |
          ! grep -RniE 'vercel|supabase' package.json src web scripts daml || {
            echo "Forbidden runtime dependency reference detected"
            exit 1
          }
