name: Verified Delivery
on:
  push:
    branches: [main, 'fix/**', 'season4/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run every Node test
        run: |
          mkdir -p evidence
          set -o pipefail
          npm test 2>&1 | tee evidence/node-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-evidence-${{ github.sha }}
          path: evidence/node-tests.log
  canton-proof:
    # Untrusted fork PRs never receive a private-repository read token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned open-source DPM
        run: bash scripts/bootstrap-dpm.sh
      - name: Build, test, deploy and capture a real local Canton lifecycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/run-local-proof.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canton-evidence-${{ github.sha }}
          path: |
            evidence/*.log
            evidence/*.json
          if-no-files-found: warn
          retention-days: 30
  repository-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Required files and constraints
        run: |
          test -f LOCKED_DECISIONS.md
          test -f docs/COMPETITION_COMPLIANCE.md
          test -f docs/EVIDENCE_MANIFEST.md
          test -f docs/DEMO_SCRIPT.md
          test -f docs/SUBMISSION_DRAFT.md
          test -f docs/SEASON4_RULES_SNAPSHOT.md
          test -f docs/SEASON4_LOCKED_PLAN.md
          test -f docs/DEVNET_PROOF_RUNBOOK.md
          test -f docs/VALIDATION_SPRINT.md
          test -f daml/daml/CommitLedger.daml
          ! grep -RniE 'vercel|supabase' package.json src web scripts daml
          ! git ls-files | grep -E '(^|/)\.env(\.local)?$'
